# Keefamania (Yahoo league #49649) — team "Air Raid Gabriel".
# Settings read from the live Yahoo settings page 2026-08-29 and RE-VERIFIED
# line by line 2026-08-31 (Yahoo API approval still pending, so `verify`
# cannot run for this league; this block is the transcription of record).
# 2026-08-31 re-read confirmed ALL of: Live Standard Draft (snake), Sat Sep 5
# 10:00pm EDT, 10 teams, 1-minute timer, roster QB/WR/WR/RB/RB/TE/W-R-T/K/DEF
# + 6 BN + 2 IR, rec 0.5, pass 25yd/pt, pass TD 4, INT -1, rush 10yd/pt,
# rush+rec TD 6, fumble -2, the +2 40-yard passing TD bonus, waivers
# "Continual rolling list" with a 2-day period, playoffs 6 teams weeks 15-17,
# trade deadline Nov 28. ROUND COUNT: 15 non-IR slots -> 15 rounds; IR slots
# are not filled during a Yahoo draft, so the round-gated guardrails
# (qb2_earliest_round, upside_from_round, K/DEF timing) are correctly aligned.
# Also noted: "injured players may be added directly to the injury slot: Yes".
# DRAFT: Saturday Sep 5, 2026, 10:00 PM EDT / 7:00 PM PT · snake · 60s clock.

platform: yahoo
league_id: "49649"
draft_id: null              # Yahoo has no separate draft id; tracker uses manual/browser feed
season: 2026
stats_season: 2025

me:
  username: "Air Raid Gabriel"   # Yahoo team name (no Sleeper identity)
  user_id: null
  draft_slot: null               # unknown until Yahoo reveals draft order

# 10-team · half-PPR · ONE flex (W/R/T). PURE FORMAT DERIVATION —
# draftkit.onboard.derive_baselines(10, roster) returns exactly this block.
# Nothing here is tuned to this league, and a new league gets its own numbers
# from the same function.
#
# These were QB5/TE8 until 2026-09-01, hand-fitted by minimising
# |VORP rank - ADP rank|. That was fitting the baseline to the market's
# opinion, and it was compensating for a bug rather than measuring anything:
# the two-pick planner compared positions on raw VORP LEVELS, so it needed
# QB value artificially suppressed to stop drafting quarterbacks early.
# Urgency was never affected (it is a difference — the baseline cancels).
#
# The planner now measures against the player you would actually END UP WITH
# at each position given your remaining picks (Tracker._fallback_points), so
# the baseline no longer steers the draft: across QB5/TE8, QB7/TE10 and
# QB10/TE11 the engine's drafted lineups now spread 0.4 points over 22 slots,
# against 4.0 before. The magic number is gone because it stopped mattering.
replacement_baselines:
  QB: 10
  RB: 24
  WR: 24
  TE: 11
  K: 10
  DEF: 10

pool_sizes:
  QB: 26
  RB: 49
  WR: 44
  TE: 27
  K: 14
  DEF: 14

guardrails:
  qb2_earliest_round: 10
  te2_fall_picks: 12

tiers:
  break_z: 0.5
  cliff_z: 1.0
  # gap_sd is the original: a new tier when the drop from the PREVIOUS
  # player beats mean + break_z x std of that position's drops. It puts
  # 27 of 29 QBs in one tier because Allen's 211-point gap sets a bar no
  # gap between two real quarterbacks can clear (DECISIONS: tier method).
  # anchor_frac is the spreadsheet's rule: a new tier when the drop from
  # the TIER'S TOP PLAYER beats break_frac x the position's best value.
  # Default stays gap_sd until the change is gated. Cliffs are identical
  # under both.
  method: gap_sd
  break_frac: 0.20
  adp_include_within: 150   # 10 teams x 15 rounds

# Standing tilts OFF for this draft (2026-09-01).
#
# They change EVERY pick -- 0 of 22 replayed rosters were identical with them
# on vs off -- and they are unvalidated. A replay cannot settle whether that
# is good, because tilts alter proj_pts and each arm then wins on its own
# ruler: judged by the untilted model, turning them off is +1.7 points; judged
# by the tilted model, it is -33.3. Grading a change of belief against that
# same belief proves nothing.
#
# So this is a risk decision, not a measurement: an unvalidated intervention
# that moves every pick is not something to carry blind into a real draft.
# The theses stay in the research file for re-adoption behind a CLV backtest.
tilts:
  enabled: false
  mid_te_fade: 0.08
  nonrush_qb_fade: 0.08
  rush_qb_late_boost: 0.08
  elite_te_boost: 0.05
  top5_regression: 0.10
  cap: 0.10

# Transcription of the Yahoo settings page (2026-08-29) — the closest thing
# to a verify target until API access exists
expected:
  teams: 10
  rounds: 15                # 9 starters + 6 bench (2 IR drafted separately: no)
  pick_timer: 60
  type: snake               # "Live Standard Draft"
  roster: [QB, WR, WR, RB, RB, TE, "W/R/T", K, DEF, BN, BN, BN, BN, BN, BN, IR, IR]
  scoring:
    rec: 0.5                # HALF PPR — the big difference from Omnibeta
    pass_yd: 0.04           # 25 yards per point
    pass_td: 4.0
    pass_int: -1.0
    rush_yd: 0.1
    rec_yd: 0.1
    rush_td: 6.0
    rec_td: 6.0
    fum_lost: -2.0
    pass_td_40p: 2.0        # league custom: +2 bonus on 40+ yard passing TDs
  waivers: rolling_list     # NOT FAAB — priority list, 2-day claims, Tue game-time
  # Recorded facts that `verify` does not diff and no code reads (review
  # 2026-09-04). Kept as comments so this block holds only what verify
  # actually checks; promote one back to a key the day a consumer exists.
  #   trade_deadline: 2026-11-28
  #   playoffs: "6 teams, weeks 15-17, reseeding on"
  #   ir_slots: 2

# Dataset scoring reads expected.scoring above (one block, no drift —
# code review 2026-08-30). pass_td_40p +2 is recorded there but NOT modeled:
# nflverse weekly lacks TD distance; deep-ball QB bias handled by awareness.

# Projection source for THIS league (user decision 2026-09-04): the FantasyPros
# consensus sheet alone. Placed here rather than in config.yaml on purpose:
# config.yaml is global, and Omnibeta is mid-season on the model path, so a
# global switch would silently re-price the in-season manager's waiver and
# lineup values for a league that is already playing.
#
# What this is and is not. The external path is built and verified end to end
# (2026-09-02). Taken first as a philosophy decision (projections are an
# input, the edge is roster-aware timing), then GATED on history the same
# evening (DECISIONS #49): FantasyPros' own preseason consensus for 2024 and
# 2025, recovered from the Wayback Machine (scripts/fantasypros_history.py),
# passes the source gate against the model on accuracy and wins the outcome
# replay by +9.4% lineup points over 44 slot-drafts, every pair positive.
# That validates the consensus LINE the sheet's tabs carry; the headline
# transform on top (#45) remains a definition, not a measured claim.
#
# Consequences accepted: a player the sheet does not carry has no projection
# and is invisible to the engine (the rebuild reports the count); one source
# means every proj_sd is zero, so late_round_dispersion stays inert.
projections:
  source: external
  external:
    sources: [sheet]
    combine: first
    # The FantasyPros DraftSheet workbook this league drafts on: the user's
    # league-settings copy of the 09-04 download (Scoring tab 10 teams). The
    # loader scores the lines with THIS yaml and reproduces the headline from
    # the workbook's own formulas (DECISIONS #54), so the default-settings
    # copy gives the identical board. Replace the file, rebuild tiers,
    # re-export board.json, restart the bridge.
    sheet_path: data/external/DraftSheets_2026_Keefamania_10tm_halfPPR_1flex_v2.xlsx
    sheet_as_of: "2026-09-04"     # fallback only: the workbook's own 'Updated:' cell wins when present
    # Which of the sheet's numbers IS the projection (user decision
    # 2026-09-04, DECISIONS #45). `tab` is the position tab's line scored in
    # league settings plus the rookie bump (the tab's AVG cell, a 17-game
    # total, scaled 16/17 by the board). `headline` is the DraftSheet tab's
    # PTS, the number the sheet's reader sees: the sheet's Zscore
    # Projection, an average of its Aggregate LOW/AVG/HIGH (tab line / 17 x
    # (games - RISK-tab missed games by ECR rank slot)) and the ECR-slot
    # points (the k-th largest AVG at the position, k = the ECR slot).
    # Since DECISIONS #54 the loader REPRODUCES that number from the
    # workbook's raw inputs with THIS league's scoring and reads the games
    # basis, the averaging form and the rank windows off the workbook's own
    # formulas, so the workbook can be the default-settings copy (its team
    # count, roster and auction cells never enter PTS) and a formula change
    # between downloads is followed, not assumed. Median 0.82 of the tab
    # number, rank order within position 0.975-0.996 the same; what moves is
    # the gaps, and the engine runs on gaps. Chosen so the engine and the
    # page agree on every number, not on a measurement of the rank-based
    # durability haircut it carries (the games-table analogue was a wash at
    # QB/WR/TE, DECISIONS #31).
    sheet_line: headline
  # OFF on the sheet path. The rule zeroes any depth-chart backup the market
  # does not rank as a starter. That was a crutch for the usage MODEL, whose
  # per-game rate cannot say "he will not start". A consensus sheet already
  # prices role: on the 2026-09-04 build the rule erased seven real sheet
  # lines on drafted players (Mendoza 191.6, Pacheco 103.6, Ferguson 103.0,
  # Kamara 101.1, Sadiq 100.5, Coleman 98.4, Njoku 86.4) and set them to 0,
  # i.e. it declared the expert panel wrong by 100% on the strength of a
  # depth-chart order. Under "solely the sheet" the sheet's number stands.
  # The separate availability rule still zeroes `out` players (Jacobs,
  # Charbonnet), because out is a fact and not a view.
  non_starters_zero: false

market:
  teams: 10
  ffc_format: half-ppr   # FFC half-PPR feed; overridden by data/external/yahoo_adp.keefamania.csv (league-scoped name!)

flex_split:            # derived by scripts/derive_flex_split.py (plan A4); a league fact, re-derive, never copy
  RB: 0.800
  WR: 0.200
  TE: 0.000
  derived: 2026-09-02
  board: tiers.keefamania.csv

# Late-round dispersion ON for this league (user, 2026-09-04): from
# upside_from_round the shortlist ranks on mean + dispersion_lambda x the
# player's own published range (proj_band, the sheet's high/low rows) in
# place of the flat 1.15 upside multiplier. proj_sd is zero on one source, so
# the band is the only dispersion the tracker can see. League-scoped because
# Omnibeta has no band (model path) and is in season.
engine:
  late_round_dispersion: true
  # Housekeeping 2026-09-04 (DECISIONS #50), both measured on the headline
  # board before switching on. fallback_floor: wire floors the fallback at
  # the draft_k-th predicted-undrafted player instead of the board minimum
  # (the cliff of #42) or the season baseline (drafted players by round 5,
  # 28% churn); churn 8 of 150 picks, all K/DEF order in rounds 14-15.
  # turn_look_through: at the turn, survival and urgency look through to the
  # following turn and the partner is priced as certain; churn 5 of 150,
  # seats 1 and 10 only, rounds 4-6.
  fallback_floor: wire
  turn_look_through: true
  # DECISIONS #53: the touchdown tiebreak (tie_break: touchdowns, window 5.0)
  # ran for one room (10790713, fired once, Rice over Etienne at 36) and the
  # user reverted it the same morning. Today's rule again; the knob stays in
  # the engine, measured and off, like the bench knobs.
  tie_break: scarcity
  tie_window: 1.0
