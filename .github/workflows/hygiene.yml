# The pre-commit hook is opt-in per clone (git config core.hooksPath .githooks),
# so it cannot be the only line of defence. This is the one that always runs.
name: hygiene

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: state/ must not ride along with code changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # NOT HEAD. On a pull_request event the checkout is a MERGE commit of
          # this branch into main's CURRENT head, so anything main gained while
          # the PR was open is inside HEAD. The manager commits state/ hourly on
          # a schedule, so `base...HEAD` reported main's own state commit as
          # riding along with this branch's code -- a false positive that would
          # hit essentially every PR left open for an hour.
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse "$head~1" 2>/dev/null || echo "$head")"
          fi
          python scripts/check_commit_hygiene.py --range "$base...$head"
