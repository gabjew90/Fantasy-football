# Failure notifier: opens an [ACT NOW] issue (with an @mention -> email +
# app push) whenever weekly, gate or props goes red. Zero secrets, zero deps.
#
# `props` was added 2026-09-17: it runs every 15 minutes and commits the
# betting record, and its failures were silent. A capture that dies takes a
# snapshot with it, and a closing line cannot be captured retrospectively.
name: notify
on:
  workflow_run:
    workflows: [weekly, gate, props]
    types: [completed]

permissions:
  issues: write

jobs:
  issue-on-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"[ACT NOW] manager workflow FAILED: $WF_NAME\",\"body\":\"@${{ github.repository_owner }}\n\nWorkflow **$WF_NAME** went red.\nLogs: $WF_URL\nThe system may be missing checks until this is fixed.\"}"
