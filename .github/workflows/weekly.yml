# Hourly dispatcher for the weekly jobs. GitHub cron is best-effort and on
# this repo it fires 1-6 hours late (median 128 min over 38 runs, measured
# 2026-09-16); the fixed per-event crons this replaces put only the Tuesday
# waiver brief inside its two-hour Pacific window in three weeks of running.
# `python -m manager cron` now runs each job on the first tick after its
# start time on its day, once per period (manager/jobs.py SCHEDULE), so the
# lag costs at most an hour plus GitHub's delay. Delivery stays content-hash
# idempotent. The repo is public, so the hourly install costs no minutes.
# SCHEDULE OFF since 2026-09-25 (DECISIONS #109): the user asked for no
# scheduled fantasy notifications. Manual runs only (Actions tab -> Run
# workflow); restoring the schedule block below is the whole undo.
name: weekly
on:
  workflow_dispatch:
    inputs:
      job:
        description: force one job (plan/waivers/scout/lineup/health)
        required: false
  # schedule:
  #   - cron: "0 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: manager-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: daily players-dump cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: sleeper-raw-${{ github.run_started_at }}
          restore-keys: sleeper-raw-
      - name: run due jobs (every league)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          # Yahoo: the refresh token is the durable credential; the sign-in
          # happened once, locally (scripts/yahoo_auth.py). Each league's
          # state lives in its own directory (manager.context.state_dir).
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          for league in omnibeta keefamania; do
            if [ -n "${{ github.event.inputs.job }}" ]; then
              python -m manager --league "$league" cron --job "${{ github.event.inputs.job }}"
            else
              python -m manager --league "$league" cron
            fi
          done
      - name: commit state
        if: always()
        run: |
          git config user.name "auto-manager"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "state: weekly $(TZ=America/Los_Angeles date '+%a %m/%d %H:%M PT')"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
