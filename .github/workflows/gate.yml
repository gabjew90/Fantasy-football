# The 15-minute gate: executes checks from the committed state/week_plan.json
# whose due time has passed and aren't done. The first step is a stdlib-only
# window guard against state/gate_hours.json (written by the Monday planner),
# so ticks outside decision windows exit in seconds and conserve free-tier
# minutes; Python/deps only install when there is real work.
name: gate
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: manager-state
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: window guard (cheap, stdlib only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCED=--forced; else FORCED=; fi
          python3 scripts/gate_guard.py $FORCED >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: daily players-dump cache
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw
          key: sleeper-raw-${{ github.run_started_at }}
          restore-keys: sleeper-raw-
      - name: gate tick (every league)
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          # Yahoo: the refresh token is the durable credential; the sign-in
          # happened once, locally (scripts/yahoo_auth.py). Each league's
          # state lives in its own directory (manager.context.state_dir).
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          python -m manager gate
          python -m manager --league keefamania gate
      - name: commit state
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "auto-manager"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "state: gate $(TZ=America/Los_Angeles date '+%a %m/%d %H:%M PT')"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
