# Props historical record. Independent of the fantasy workflows: its own
# concurrency group (they use `manager-state`) and its own paths, so a props
# tick and a manager tick can never fight over the same commit.
#
# Three jobs, all driven off one cheap stdlib-only guard so ticks outside a
# kickoff window exit in seconds and cost almost no free-tier minutes:
#   capture  score every game that kicks off soon; inside 60 minutes of kickoff
#            the snapshot is `close`, earlier it is `decision`. The closing
#            snapshot is the one CLV depends on and the one a chat session
#            cannot reliably produce by hand.
#   settle   Tuesday, after nflverse publishes weekly stats; grades every
#            recorded call against what actually happened.
#   scorecard rebuilds record/scorecard.md from the settled rows.
#
# The engine reads prices from Sleeper (no key, no quota) by default.
# ODDS_API_KEY is passed only so a DK/FD closing capture is possible when the
# quota allows; it is never committed to the tree.
name: props

on:
  workflow_dispatch:
    inputs:
      mode:
        description: capture | settle | scorecard
        required: false
        default: capture
      season:
        description: season (default current)
        required: false
      week:
        description: week (default current)
        required: false
      games:
        description: "optional game list, e.g. MIA@SF,DET@BUF"
        required: false
  schedule:
    # every 15 minutes; the guard decides whether there is real work
    - cron: "*/15 * * * *"
    # Tuesday 15:00 UTC (08:00 PT), after weekly stats publish
    - cron: "0 15 * * 2"

permissions:
  contents: write

concurrency:
  group: props-record
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: window guard (stdlib only, no deps installed yet)
        id: guard
        run: python3 props/guard.py >> "$GITHUB_OUTPUT"
        env:
          PROPS_MODE: ${{ github.event.inputs.mode }}
          PROPS_SEASON: ${{ github.event.inputs.season }}
          PROPS_WEEK: ${{ github.event.inputs.week }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.guard.outputs.run == 'true'
        run: pip install -r props/requirements.txt

      - name: nflverse cache
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: props/.cache
          key: props-nflverse-${{ github.run_started_at }}
          restore-keys: props-nflverse-

      - name: boundary tests
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install pytest
          python -m pytest props/tests -q

      - name: resolve the pinned engine
        # THE ENGINE COMES FROM THE TAG, THE GLUE FROM MAIN. props/engine.lock.json
        # on main names the release; the engine is exported from that tag into
        # RUNNER_TEMP, never into the working tree -- `git checkout <tag> -- props/engine`
        # would stage it, and the commit step below would then push the pinned
        # engine over whatever main has.
        #
        # A FETCH FAILURE DOES NOT SKIP THE CAPTURE. A missed closing line cannot
        # be recaptured; a run on main's engine can be identified after the fact,
        # because every row it writes carries engine_source=main-fallback and the
        # hash of what actually ran. The job is failed at the very end, after the
        # record is committed, so notify.yml still opens an issue.
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.mode == 'capture'
        id: engine
        run: |
          set -uo pipefail
          TAG=$(python3 -c "import json;print(json.load(open('props/engine.lock.json'))['tag'])")
          HASH=$(python3 -c "import json;print(json.load(open('props/engine.lock.json'))['engine_sha256'])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          DEST="$RUNNER_TEMP/engine"
          mkdir -p "$DEST"
          if git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG" \
             && git archive --format=tar "refs/tags/$TAG" props/engine | tar -x -C "$DEST" \
             && python3 props/engine_version.py verify \
                  --engine-dir "$DEST/props/engine" --expect-hash "$HASH"; then
            echo "ENGINE_DIR=$DEST/props/engine" >> "$GITHUB_ENV"
            echo "ENGINE_SOURCE=tag" >> "$GITHUB_ENV"
            echo "source=tag" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=pinned engine unavailable::$TAG could not be fetched or did not verify; running main's engine and marking every row main-fallback"
            echo "ENGINE_DIR=props/engine" >> "$GITHUB_ENV"
            echo "ENGINE_SOURCE=main-fallback" >> "$GITHUB_ENV"
            echo "source=main-fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: capture
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.mode == 'capture'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # NFL_OUT is the scorer's real output knob (score_game.py:54). The
          # step used to set PROPS_WORKDIR, which nothing reads, so OUT fell
          # back to its hard-coded /mnt/user-data/outputs and EVERY capture
          # died on a runner: PermissionError on /mnt/user-data from
          # score_game, then OSError "non-existent directory" from score_week
          # writing slate_runs.
          #
          # INPUTS ARE CACHED, OUTPUTS ARE NOT. --workdir points into
          # props/.cache so the nflverse downloads survive between ticks (the
          # scorer's default is ~/nfl_wd, which the cache step never saw, so
          # it had been storing an empty directory). NFL_OUT must NOT live
          # there: score_game APPENDS to line_archive_nfl_<season>.jsonl
          # (score_game.py:824), so a cached output directory handed the next
          # run its own previous archive and re-appended to it -- measured on
          # run 35310231919, which fed record_run 136 rows against a 68-row
          # record and would have doubled again every tick. RUNNER_TEMP is
          # fresh per run, which is what an append-only artifact needs.
          NFL_OUT: ${{ runner.temp }}/props-out
        run: |
          mkdir -p "$NFL_OUT"
          python "$ENGINE_DIR/scripts/score_week.py" \
            --season ${{ steps.guard.outputs.season }} \
            --week ${{ steps.guard.outputs.week }} \
            --workdir props/.cache \
            ${{ github.event.inputs.games && format('--games {0}', github.event.inputs.games) || '' }} \
            --skip-started
          # One invocation, no `|| --dir .` fallback: record_run exits non-zero
          # for a missing directory AND for "no artifacts found" AND for a bug
          # inside persist, so the fallback masked every one of those as the
          # same duplicate error instead of failing loudly.
          # ONE VARIABLE FEEDS BOTH, so the stamp cannot describe a different
          # tree than the one that scored.
          python props/record_run.py \
            --dir "$NFL_OUT" \
            --snapshot-type ${{ steps.guard.outputs.snapshot_type }} \
            --engine-dir "$ENGINE_DIR" \
            --engine-source "$ENGINE_SOURCE"

      - name: settle
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.mode == 'settle'
        run: python props/settle.py --season ${{ steps.guard.outputs.season }}

      - name: scorecard
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.mode != 'capture'
        run: python props/scorecard.py --season ${{ steps.guard.outputs.season }}

      - name: commit record
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "props-record"
          git config user.email "actions@users.noreply.github.com"
          git add props/record
          git diff --cached --quiet || git commit -m "props: ${{ steps.guard.outputs.mode }} $(TZ=America/Los_Angeles date '+%a %m/%d %H:%M PT')"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: fail if the capture ran an unpinned engine
        # Deliberately last: the record is already written and pushed. This
        # exists only so notify.yml opens an [ACT NOW] issue -- the rows say
        # main-fallback either way, but a red run is what gets noticed.
        if: always() && steps.engine.outputs.source == 'main-fallback'
        run: |
          echo "::error title=unpinned engine::the capture ran main's engine, not ${{ steps.engine.outputs.tag }}; rows are stamped main-fallback"
          exit 1
