# Omnibeta Degens draft prep — all league facts re-verified from the Sleeper API
# by `python -m draftkit verify` (do not hand-edit league facts; edit strategy knobs).

league_id: "1395566811415588864"
draft_id: "1395566812157984768"
season: 2026
stats_season: 2025          # season used for the predictive dataset

# Sleeper identity — resolved to a draft slot via the draft_order at runtime,
# so this stays correct even if the commissioner reshuffles the order.
me:
  username: farmerjamal     # your Sleeper username
  user_id: null             # or your numeric Sleeper user_id
  draft_slot: null          # or force a slot 1-12 (overrides the above)

# Replacement baselines corrected for 12-team / 2-FLEX / full-PPR
# (flex spots skew WR in full PPR — deliberately not WR48/RB36).
replacement_baselines:
  QB: 12
  RB: 40
  WR: 60
  TE: 12
  K: 12
  DEF: 12

# How many players per position make the draftable pool in tiers.csv
pool_sizes:
  QB: 28
  RB: 65
  WR: 80
  TE: 28
  K: 16
  DEF: 16

projections:
  # weight on the stats-based model for players with 2025 data
  # (1 - alpha) goes to the market-implied projection from ECR;
  # players with no 2025 data (rookies, returners) are 100% market-implied.
  model_alpha: 0.55
  # games-played regression: ppg is shrunk toward the positional mean with
  # weight games/(games + k)
  shrink_k: 5
  # Convention rule (final spec §1): all projections and replacement levels
  # use the same 16-game convention. Uniform scaling never changes ranks;
  # consistency is what matters, not 16 vs 17. Per-player durability is the
  # separate exp_games haircut (16 - 3yr avg games missed, floored at 12).
  expected_games: 16.0
  # Veterans with >= this many 2025 fantasy points but no market row at all
  # get a pure stats-model projection, flagged no_market: on the board for a
  # manual eyeball, ignored by the live engine unless activated by an override.
  no_market_floor: 60

engine:
  sims: 1000          # Monte Carlo draft simulations per decision
  pool_size: 80       # rivals sample from the top-N undrafted by ADP
  sigma_early: 6.0    # ADP noise (picks) in round 1  (~0.5 rounds)
  sigma_late: 27.0    # ADP noise (picks) by round 15 (~2.25 rounds)

guardrails:
  qb2_earliest_round: 10   # 2nd QB never before this round
  te2_fall_picks: 12       # 2nd TE only if a top-6 TE fell >= this many picks past ADP

tiers:
  # a gap becomes a tier break when it exceeds mean + break_z * std of
  # within-position VORP gaps; a break is also flagged as a CLIFF when it
  # exceeds mean + cliff_z * std (per the handoff: 1 standard deviation).
  break_z: 0.5
  cliff_z: 1.0
  # the board always includes every player with ADP inside the draft's pick
  # count (12 teams x 15 rounds), regardless of model rank — the Monte Carlo
  # rivals must be able to draft anyone the market actually drafts.
  adp_include_within: 180

tracker:
  poll_seconds: 5
  # never recommend K/DEF before this round unless only K/DEF needs remain
  kdef_earliest_round: 14
  # alert when a player has fallen at least this many picks past ADP
  # (12 = one full round in this league)
  fall_alert_picks: 12

paths:
  raw: data/raw
  external: data/external
  processed: data/processed
  logs: data/logs
