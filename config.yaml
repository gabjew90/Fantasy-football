# Global engine configuration. League-specific facts and strategy knobs live
# in leagues/<name>.yaml (see default_league). Precedence: league file wins
# over globals on every key, deep-merged. Select a league with
# `--league <name>` or the DRAFTKIT_LEAGUE env var.

default_league: omnibeta

projections:
  # ---- Projections are an INPUT (DECISIONS 2026-09-02 #21) ----------------
  # source: external  -> stat lines from outside, scored in each league's
  #                      own settings (draftkit/external.py). The engine's
  #                      edge is roster-aware timing, not projection modeling.
  #         model     -> the 2025-usage + log(ECR) blend (knobs below), to be
  #                      retired: it comes back only if scripts/projection_backtest.py
  #                      shows it beating the external source out of sample.
  # STATUS 2026-09-02: external is built and verified end to end. The gate
  # was redefined around quality (DECISIONS #23, thresholds pre-registered)
  # and the external stand-in (Sleeper week-1 lines, the only outside lines
  # with history) FAILED both halves: pooled MAE 5% worse than the model in
  # both leagues, and actual-points lineups 1.2% worse over 44 replayed
  # slot-drafts against identical rivals (reports/source_gate.md; the
  # first run's -1.6% had a rival-pool flaw, corrected the same day). So
  # the default stays `model`; the
  # external path is kept as a parallel column and the 2026 sheet is judged
  # when 2026 is played.
  source: model
  # GAMES CONVENTION: every external line is a 17-game season total and is
  # scaled once, by games/17, for everyone. Sleeper's gp=18 is a week count
  # and is ignored. Baselines, bench pricing and the manager all read
  # proj_pts on this basis (16 = 17 fantasy weeks minus the bye).
  games: 16
  external:
    sources: [sheet, sleeper]     # order matters under combine: first; espn is a third source (plan A1)
    # combine: first -> first source wins per player, later ones fill gaps
    #          mean  -> equal-weight per-stat mean of every source carrying the
    #                   player, scored once; dispersion columns (proj_sd/hi/lo,
    #                   n_sources) come from the spread of per-source scores.
    # 'first' until the pre-registered gate (DECISIONS #30) passes on 2026
    # actuals -- ESPN has no history, so the mean arm is unjudgeable before then.
    combine: first
    # sheet_path / sheet_as_of are LEAGUE facts (which workbook a league drafts
    # on) and live in leagues/<name>.yaml under projections.external; a league
    # without one simply has no sheet source (reported, not an error).
  # the one tail rule: depth-chart backups the market also does not rank as
  # starters project 0 (contingent_of keeps the handcuff column informative)
  non_starters_zero: true
  # plan A2 (DECISIONS #31): mean missed games by position x ex-ante rank band,
  # applied as games - (missed[pos,band] - pooled_mean) so only cross-cell
  # differences move the board; band from the provisional market rank. OFF
  # until its pre-registered gate passes on the backtest pairs.
  games_table:
    enabled: false
    mode: differential
    path: data/processed/absence_bands.json

  # ---- legacy model knobs (projections.source: model only) -----------------
  # weight on the stats-based model for players with 2025 data; (1 - alpha)
  # goes to the market-implied projection. This scalar is the FALLBACK â€”
  # v2 item 1.7 varies alpha by player type (see alpha_by_type).
  model_alpha: 0.55
  alpha_by_type:
    stable_veteran: 0.65     # 12+ games last season, same team
    volatile: 0.40           # rookies, new-team players
  # Per-position CAP on the usage weight, from the out-of-sample backtest
  # (scripts/projection_backtest.py, DECISIONS 2026-09-02 #20): at WR every
  # step of alpha above 0 was worse in 2023->2024 and 2024->2025, in both
  # leagues, on MAE and on rank correlation. 0.2 rather than the grid's 0 is
  # the hedge against two seasons of evidence. RB/QB/TE flipped between
  # seasons and are not capped.
  alpha_cap_by_position:
    WR: 0.20
  # games-played regression: ppg shrunk toward positional mean g/(g+k)
  shrink_k: 5
  # All projections and replacement levels use the same 16-game convention
  # (uniform scaling never changes ranks). The per-player durability haircut
  # was REMOVED 2026-08-29 (v2 plan 1.3, research Q6) â€” exp_games is
  # informational only.
  expected_games: 16.0
  no_market_floor: 60
  # Projection overhaul item 1 (2026-09-02). The market half of the blend is
  # either the log-rank curve fitted to our own model points (ecr_curve) or
  # consensus stat lines scored in league settings (stat_lines). stat_lines
  # is built as a PARALLEL column (proj_consensus_pts) whatever this says;
  # the default flips only when the backtest (item 2) says so.
  market_source: ecr_curve
  # DECISIONS #40: the log-rank curve stops decaying inside the range it was
  # fitted on (it loses 60 pts across RB ranks 1-13 and 7 pts across 37-60,
  # while actuals fall 118 -> 88 and are still falling). Arms, graded
  # separately so a verdict names its cause:
  #   off       today, byte for byte
  #   rank      within-position rank as the regressor instead of raw ECR/ADP
  #   rank_lin  + a linear-in-rank term at RB and WR (the graded candidate)
  #   full      + tangent continuation past the fit population's last rank
  #             (production-only: ~7 of 684 backtest rows)
  market_curve_tail:
    mode: "off"              # quoted: bare off is a YAML 1.1 boolean
    min_fit: 30              # safety net for a thin cell, not the position selector
  consensus:
    enabled: true            # fetch + score the parallel column at every build
    line_games: 17           # the stat lines are 17-game season totals (gp=18 is a week count)
  # Usage-side fix 1 (2026-09-02): scale the MODEL term by a depth-chart
  # backup's expected share of starting weeks (draftkit/role.py), only when
  # the market rank agrees he is a backup. Starters per team by position.
  role_gate:
    enabled: true
    starters: {QB: 1, RB: 2, WR: 3, TE: 1}

engine:
  sims: 1000          # Monte Carlo draft simulations per decision
  # Rival sampling pool: a ROLLING ADP WINDOW around the current pick, not a
  # fixed top-N. A fixed top-80 starved in the late rounds (board includes
  # everyone with ADP inside 180) and inflated survival right where the
  # round-8 upside switch decides. pool_min is the floor so it never starves.
  pool_min: 40        # never sample from fewer than this many candidates
  pool_lookback: 20   # include players whose ADP is up to N picks BEHIND now
  pool_lookahead: 60  # ...and up to N picks ahead
  sigma_early: 6.0     # 2026-09-05 study (11 rooms, shown objective): floored draw at 6/27 (was 10.0 under order, #46)
  sigma_late: 27.0    # 27/6 scaled with sigma_early (was 45.0)
  # fat-tail reach mixture: with reach_prob, a rival's ADP noise is scaled
  # by reach_scale (one-directional reaches, CLV retro: QBs reached 33-46
  # picks early in this room)
  reach_prob: 0.15
  reach_scale: 3.0
  # positional-run escalation: 2+ same-position picks in the last 5 multiply
  # that position's pick weight
  run_window: 5
  run_min: 2
  run_boost: 1.5
  # round-dependent objective (v2 item 1.5): from this round, gated players
  # score on an 85th-percentile proxy instead of median
  upside_from_round: 8
  upside_mult: 1.15
  # ---- late-round dispersion (plan A3, DECISIONS #32) ---------------------
  # From upside_from_round, rank on mean + dispersion_lambda x the spread of
  # the projection across sources (proj_sd, >= 2 sources) instead of the
  # boolean upside multiplier. Inert while combine: first (every spread is
  # 0). lambda fixed in advance; judged on 2026 actuals.
  late_round_dispersion: false
  dispersion_lambda: 0.5
  # ---- near-tie rule (DECISIONS #53) ---------------------------------------
  # scarcity: inside planner.NEAR_TIE (1.0) the player less likely to survive
  # to the next turn goes first. touchdowns: inside tie_window, a skill-vs-
  # skill near-tie goes to the player with more projected touchdowns (QB/K/DEF
  # pairs keep scarcity). touchdowns was tried for one room on 2026-09-05 and
  # reverted the same morning; both leagues run scarcity (+ the floor rule of
  # DECISIONS #55, which has no knob).
  tie_break: scarcity
  tie_window: 1.0
  # handcuff_split (DECISIONS #58): a handcuff's uplifted rate counts only in
  # his own starter's absence weeks, his own rate in the rest of the cover.
  # Off = the DECISIONS #8 pricing. Measured per league before switching on.
  handcuff_split: false
  # ---- rival-behaviour knobs (plan 2026-09-02 B3) -------------------------
  # Hoisted from constants in draftkit/urgency.py at the values that were in
  # force, so every prediction logs the knob set it was made under and the
  # B7 refit can move them on evidence. Nothing here is fitted yet.
  need_damp: 0.15            # a position that fills none of the rival's open starter slots
  qb_filled_damp: 0.05       # rival's QB slot already filled ...
  qb_damp_until_round: 10    # ... before this round
  kdef_early_damp: 0.02      # K/DEF before the rival's typical round minus one
  kdef_typical_round: 13     # fallback typical round when no seed says otherwise
  # B4: a run is count > run_ratio x the model's own expected count for the
  # position; 0 = the old absolute rule (2-in-5 of anything). Measured
  # 2026-09-02 (DECISIONS #29): the relative rule drafted the identical team
  # on 21 of 22 slots and one Keefamania slot ~1 point lower, which fails the
  # pre-registered "not worse on both leagues" by a hair, so the old rule
  # stays the default and the relative rule waits for more rooms.
  run_ratio: 0
  autopick_sigma_scale: 0.5  # B5: an autopicking rival's ADP noise as a fraction of sigma (prior)
  autopick_need_damp: 0.02   # B5: autopick fills starters first; a non-filling position while a starter slot is open
  autopick_list_prob: 0.4    # 2026-09-05 study: 0.4 at the floored/6-27 point (was 0.2 under order, #46)
  # HOW a rival chooses among the alive pool (survival study 2026-09-04,
  # DECISIONS #46): lottery = today (Gaussian-in-(pick - ADP) draw over the
  # whole pool; a faller LOSES weight as he falls), floored (a faller weighs
  # as much as an on-ADP player), order (lowest ADP + noise wins; a faller
  # is the likeliest pick). Shown-candidate calibration is the measurement.
  rival_draw: floored  # 2026-09-05 study over 11 rooms, shown log loss 0.525 vs order/10-45 at 0.585 (was order, #46)
  # Shown-row calibration (2026-09-05): the rows the engine shows are the rows
  # other drafters want; over eleven rooms at the fitted point the SHOWN
  # survival ran 40% -> 21% observed, 60% -> 43%, 81% -> 73%, 96% -> 88%
  # (reports/survival_fit_study_2026-09-05.md, confirmation at 1000 sims).
  # Piecewise-linear knots [predicted, observed], endpoints 0 and 1 implied;
  # applied to the survival the stages, the bench multiplier and the page
  # read, never to survival_raw. Empty list = identity.
  survival_calibration: [[0.16, 0.14], [0.40, 0.21], [0.60, 0.43], [0.81, 0.73], [0.96, 0.88]]
  # ---- bench rows (2026-09-04, user-approved design; DECISIONS #47) --------
  # bench_survival_discount: rank a bench row on its COST OF WAITING (insurance
  # now minus the expected best insurance at my next turn, over the position's
  # candidates and their simulated survivals) instead of raw insurance points.
  # bench_contingency: a backup whose starter is on ANOTHER roster is also
  # priced for the role shift if that starter goes down (absence table x
  # uplift over my weakest starter). Bench near-ties break on the higher
  # ceiling in every round with no knob (DECISIONS #55). All default off =
  # today's behaviour.
  bench_survival_discount: false
  bench_contingency: false
  # bench_two_pick: value now plus the expected best insurance still
  # gettable at the OTHER bench positions next turn; value alone at the
  # last bench pick (DECISIONS #51). Supersedes the drop-off when on.
  bench_two_pick: false
  # turn seats: with no rival between consecutive picks, look through to
  # the following turn for survival and urgency, partner priced at best_now
  # (DECISIONS #50). Off = today's behaviour.
  turn_look_through: false
  rival_needs_update: true   # B6: a rival picking twice in my window consumes his needs
  # ---- correctness set (2026-09-04) --------------------------------------
  # Engine BEHAVIOUR, so it lives here in globals and not in a league file:
  # none of these five is a fact about a league. Every value below is TODAY'S
  # behaviour, so the whole set is a no-op at ship time; the knobs exist so
  # each fix can be turned on and judged on its own.
  upside_boost_relative: false   # boost off the market floor, not abs(level)
  fallback_floor: board_min      # board_min (today) | replacement
  # values: board_min (today) | replacement (season baselines; churned 28% on the
  # headline board because those baselines are drafted players by round 5) |
  # wire (the draft_k-th predicted-undrafted player, bench.waiver_ppw; DECISIONS #50)
  bench_row_wins_dedupe: false   # who wins the market/bench seam
  per_position_deadline: false   # STAYS OFF: no measurement can decide it
  # Draft-time order statistic for the bench wire. Hedges PREDICTION ERROR --
  # which undrafted player is really the best one -- and NOT claim friction,
  # which is baselines.waiver_k and belongs to the in-season path. 3 is
  # today's value, carried over unchanged. 2 was considered and rejected:
  # deep-band MAE is 65-70 pts (DECISIONS #40), and at that error the best
  # undrafted RB is a coin flip among several, which argues for hedging
  # HARDER than 3, not softer. A derivation from that error moves this number.
  draft_k: 3

tracker:
  poll_seconds: 2
  fall_alert_picks: 12

paths:
  raw: data/raw
  external: data/external
  processed: data/processed
  logs: data/logs

# In-season manager knobs. NOTE: this block was originally named `season:`,
# which silently shadowed the `season: 2026` year (YAML last-key-wins) and
# crashed the daily ADP diff from 08/24 on. Never reuse a scalar's key.
inseason:
  matchup_cap: 0.10
  matchup_shrink_weeks: 5
  score_sigma: 28.0
  sims: 4000
  regime_safe: 0.85
  regime_comfortable: 0.60
  regime_bubble: 0.25
  # Rest-of-season values shrink as the calendar does. `ros` held a SEASON
  # total at every week, so in week 14 a free agent was valued for eleven
  # games he could no longer play.
  #
  # This is the repo's one knob that does NOT default to today's behaviour,
  # and the reason is that today's behaviour is no decay at all, which no
  # value of a correctly-specified knob reproduces. `enabled: false` restores
  # the old numbers exactly, so rollback is this one line.
  ros_prorate:
    enabled: true
  # In-season age decay on ROS DISPLAYS and trade logic only â€” never touches
  # tiers.csv, projections, or any draft-layer number (post-v2 item 4).
  # Conventional-wisdom-shaped and UNVALIDATED; revisit with 2026 actuals.
  age_decay:
    # OFF everywhere until 2026 actuals can validate it (2026-09-01).
    # Displays and trade logic only; never touches draft numbers.
    enabled: false
    cap: 0.10           # max fraction lost across a full season
    per_year: 0.02      # per year above the position threshold, at season end
    thresholds:
      RB: 27
      WR: 30
      TE: 31
      QB: 33
  faab:
    league_winner: [0.40, 0.65]
    breakout: [0.15, 0.35]
    speculative: [0.05, 0.12]
    streamer: [0.01, 0.03]
    max_week_commit: 0.80
